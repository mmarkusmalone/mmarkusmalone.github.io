<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Markus-Malone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.typekit.net/lle1kea.css">

    <script data-goatcounter="https://mayamm.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="home-page light-theme">
    <script src="theme.js"></script>
    <main class="home-shell home-main">
        <div class="home-copy">
            <p>My name is <a href="about/" data-caption="About me">Maya Markus-Malone</a>.</p>

            <p>You can find me on <a href="https://www.linkedin.com/in/maya-markus-malone/" target="_blank" rel="noreferrer">LinkedIn<span class="link-icon is-inline" aria-hidden="true"></span></a>, <a href="https://x.com/mayareadsnews" target="_blank" rel="noreferrer">X<span class="link-icon is-inline" aria-hidden="true"></span></a>, and <a href="https://github.com/mmarkusmalone" target="_blank" rel="noreferrer">GitHub<span class="link-icon is-inline" aria-hidden="true"></span></a>.</p>

            <p>I am a growth engineer at Secureframe, where I build AI agents, internal applications, and scalable marketing content.</p>

            <p>See more of what I’m <a href="projects/" data-caption="AI tools, apps and experiments">building</a>, <a href="writing/" data-caption="Short stories and essays">writing</a>, and <a href="photography/" data-caption="My favorite photos and videos">taking photos of</a>.</p>
        </div>

        <footer class="home-footer">
            <div class="footer-widgets">
                <div id="spotify-widget" class="spotify-widget">
                    <div class="spotify-loading">Loading...</div>
                </div>

                <div class="reading" id="reading">
                    <p class="reading-label">Recently<br>read</p>
                    <!-- Goodreads grid widget fills this hidden div; loadReading() rebuilds it as small covers -->
                    <div id="gr_grid_widget_1794635702" hidden></div>
                    <div class="reading-grid" id="readingGrid"></div>
                </div>
            </div>
        </footer>
    </main>

    <script>
        async function fetchSpotify() {
            try {
                const res = await fetch('https://spotify-widget-chi.vercel.app/api/spotify');
                const data = await res.json();
                const widget = document.getElementById('spotify-widget');

                if (data.title) {
                    const label = data.isPlaying ? 'Now<br>playing' : 'Recently<br>played';
                    widget.innerHTML = `
                        <p class="spotify-label">${label}</p>
                        <a href="${data.songUrl}" target="_blank" class="spotify-link">
                            <img src="${data.albumArt}" alt="Album art" class="spotify-album">
                            <div class="spotify-info">
                                <span class="spotify-title">${data.title}</span>
                                <span class="spotify-artist">${data.artist}</span>
                            </div>
                        </a>
                    `;
                } else {
                    widget.innerHTML = '';
                }
            } catch (e) {
                document.getElementById('spotify-widget').innerHTML = '';
            }
        }
        fetchSpotify();
        setInterval(fetchSpotify, 30000);

        // Load the Goodreads grid widget, then re-render its books as a cover grid
        function loadReading() {
            const section = document.getElementById('reading');
            const source = document.getElementById('gr_grid_widget_1794635702');
            const grid = document.getElementById('readingGrid');

            const widget = document.createElement('script');
            widget.src = "https://www.goodreads.com/review/grid_widget/161191839.Maya's%20bookshelf:%20read?cover_size=medium&hide_link=true&hide_title=true&num_books=4&order=d&shelf=read&sort=date_read&widget_id=1794635702";
            widget.onload = () => {
                source.querySelectorAll('.gr_grid_book_container a').forEach((a) => {
                    const img = a.querySelector('img');
                    if (!img) return;

                    const book = document.createElement('a');
                    book.href = a.href;
                    book.title = a.title;
                    book.className = 'reading-book';
                    book.target = '_blank';
                    book.rel = 'noopener';

                    const cover = document.createElement('img');
                    // Swap Goodreads' thumbnail size suffix (e.g. ._SX98_.) for a sharper one
                    cover.src = img.src.replace(/\._S[XY]\d+_\./, '._SX318_.');
                    cover.alt = img.alt;
                    cover.loading = 'lazy';

                    book.appendChild(cover);
                    grid.appendChild(book);
                });
                source.remove();
                if (!grid.children.length) section.hidden = true;
            };
            widget.onerror = () => { section.hidden = true; };
            document.body.appendChild(widget);
        }
        loadReading();

        // Hover captions on the intro links: a small note pinned just under the link, left-aligned
        if (window.matchMedia('(hover: hover)').matches) {
            const hint = document.createElement('div');
            hint.className = 'link-hint';
            hint.setAttribute('aria-hidden', 'true');
            document.body.appendChild(hint);

            const placeHint = (link) => {
                // First line box of the link (a link can wrap onto two lines)
                const r = link.getClientRects()[0];
                const pad = 8;
                let left = r.left;
                const top = r.bottom + 2;
                const w = hint.offsetWidth;
                if (left + w > window.innerWidth - pad) left = window.innerWidth - pad - w;
                hint.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
            };

            document.querySelectorAll('.home-copy a[data-caption]').forEach((link) => {
                link.addEventListener('mouseenter', () => {
                    hint.textContent = link.dataset.caption;
                    placeHint(link);
                    hint.classList.add('is-visible');
                });
                link.addEventListener('mouseleave', () => hint.classList.remove('is-visible'));
            });

            window.addEventListener('scroll', () => hint.classList.remove('is-visible'), { passive: true });
        }
    </script>

</body>
</html>
